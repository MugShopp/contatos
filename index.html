<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MugShopp | Cartão Digital</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo-top img {
      max-width: 220px;
      width: 100%;
      display: block;
      margin: 0 auto;
    }

    .card {
      background: #d2b276;
      border-radius: 22px;
      padding: 55px 25px 30px;
      position: relative;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .logo-circle {
      width: 90px;
      height: 90px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      border: 2px solid #000;
      overflow: hidden;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-size: 22px;
      font-weight: 500;
      margin-top: 8px;
    }

    .role {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #000;
      margin: 10px auto 15px;
    }

    .description {
      font-size: 14px;
      line-height: 1.4;
      color: #000;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .buttons a {
      background: #000;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: transform 0.2s ease;
      display: block;
    }

    .buttons a:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo-top">
      <img src="https://i.postimg.cc/wxsStnBH/Sem_fundo.png" alt="MugShopp">
    </div>

      <div class="logo-circle">
        <img src="https://i.postimg.cc/PqGM2rSD/1000389202-fotor-20260129134156.png" alt="Luciana">

      <div class="name">Luciana Pereira</div>
      <div class="role">Proprietária</div>
      <div class="divider"></div>
      <div class="description">
        Produtos personalizados para uso pessoal e corporativo

    </div>
